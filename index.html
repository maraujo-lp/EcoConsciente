<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoConsciente - Calculadora Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>EcoConsciente</h1>
            <p>Projeto de Extensão: Economia Sustentável (ODS 12 e 13)</p>
        </header>

        <main>
            <form id="formulario">
                
                <!-- DADOS DO MORADOR -->
                <fieldset>
                    <legend>Dados do Morador (Opcional)</legend>
                    <label>Nome / Apelido:</label>
                    <input type="text" id="nome" placeholder="Ex: Dona Maria">
                    
                    <label>Quantas pessoas moram na casa?</label>
                    <input type="number" id="moradores" placeholder="Ex: 4" min="1">
                </fieldset>

                <!-- ÁGUA -->
                <fieldset>
                    <legend>Consumo de Água</legend>
                    <label>Sua torneira fica pingando? (Gotas por minuto)</label>
                    <input type="number" id="gotas" placeholder="Ex: 30 (Se não pinga, digite 0)" min="0">
                    
                    <label>Qual o valor médio da sua conta de água (R$)?</label>
                    <input type="number" id="contaAgua" placeholder="Ex: 80.00" step="0.01" min="0">
                </fieldset>

                <!-- ENERGIA -->
                <fieldset>
                    <legend>Consumo de Energia</legend>
                    <label>Quantos aparelhos você deixa na tomada (stand-by)?</label>
                    <input type="number" id="aparelhos" placeholder="Ex: 3" min="0">
                    
                    <label>Por quantas horas por dia eles ficam nesse modo?</label>
                    <input type="number" id="horas" placeholder="Ex: 10" min="0">
                    
                    <label>Qual o valor médio da sua conta de luz (R$)?</label>
                    <input type="number" id="contaLuz" placeholder="Ex: 150.00" step="0.01" min="0">
                </fieldset>

                <div class="botoes">
                    <button type="button" onclick="calcularTudo()">Calcular Meu Desperdício</button>
                    <button type="button" class="btn-limpar" onclick="limparTudo()">Limpar</button>
                </div>
            </form>

            <!-- RESULTADOS -->
            <div id="resultado-final" class="resultado-final">
                <!-- O resultado vai aparecer aqui -->
            </div>
        </main>

        <footer>
            <p>Desenvolvido para a atividade de extensão universitária - Engenharia de Software</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
